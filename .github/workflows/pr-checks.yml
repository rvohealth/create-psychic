name: PR Checks
on:
  - pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true
permissions:
  actions: none
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  spec:
    name: Unit tests (Node ${{ matrix.node-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 26 is the primary target; 24 is the oldest supported runtime
        node-version: ["26", "24"]
        shard: [1, 2, 3, 4, 5]
      fail-fast: false
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: howyadoin_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: howyadoin_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PSYCHIC_CORE_DEVELOPMENT: 1
      CI: 1
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Remove packageManager field from package.json
        run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('package.json')) {
              const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              delete packageJson.packageManager;
              fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2));
            }
          "

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      # Node 25 and later bundle no corepack, but the runner image's own Node 22 leaves one on
      # the PATH. Deleting it lets the Node 26 specs generate apps as a stock Node 26 machine
      # does, with the pnpm and Yarn it has installed. The Node 24 specs keep corepack.
      - if: matrix.node-version >= 25
        run: command -v corepack | xargs --no-run-if-empty sudo rm
      - if: matrix.node-version < 25
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: install puppeteer browsers
        run: pnpm puppeteer browsers install firefox

      # Install Bun so the bun-runtime generation specs (describe.skipIf(!bunAvailable()))
      # run in CI instead of skipping. (Deno is intentionally NOT installed: its
      # generated apps hit the SWC field-decorator boot bug — docs/deno-runtime-readiness.md.)
      - uses: oven-sh/setup-bun@v2

      # The denominator is the shard count, not strategy.job-total: the Node matrix
      # multiplies job-total, which would leave half the specs unrun per Node version.
      # Keep it equal to the length of matrix.shard.
      - run: DEBUG=1 pnpm spec --shard=${{ matrix.shard }}/5

  lint:
    name: Linting
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check-build:
    name: Check build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["26", "24"]
    env:
      NODE_ENV: development
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
