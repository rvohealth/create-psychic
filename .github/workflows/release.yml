name: Release

# Publishes to npm using OIDC trusted publishing (no NPM_TOKEN required).
# npm automatically generates a signed provenance attestation on publish.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This job publishes with the npm that Node 26 bundles (11.12.1 or later;
      # trusted publishing needs 11.5.1 or later). Installing npm@latest here
      # would run npm's newest release, which no cooldown covers, in the job
      # that can publish.
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache dependencies in release builds

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package.json version matches the release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Build
        run: pnpm build

      # npm publish tries OIDC trusted publishing first and, when that works,
      # adds the provenance attestation. If the OIDC exchange fails, npm falls
      # back to the token in NODE_AUTH_TOKEN. setup-node sets that variable to a
      # placeholder, which is not a valid token, so the publish fails instead.
      # Never set NODE_AUTH_TOKEN to a real npm token.
      - name: Publish to npm
        run: npm publish
