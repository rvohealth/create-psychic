# SECURITY — allowBuilds is a supply-chain allowlist. pnpm 10+ blocks ALL
# dependency lifecycle scripts (postinstall, etc.) by default; that default is
# the primary defense against Shai-Hulud-class npm worms. Only packages listed
# below (= true) may run install/build scripts. Keep this MINIMAL — every entry
# re-opens script execution for that package, so add one only with clear cause.
allowBuilds:
  esbuild: true
  puppeteer: true

# SECURITY — supply-chain cooldown: don't install dependency versions published
# in the last 3 days (4320 minutes). Kept under the CVE-patch SLA so routine
# patching needs no bypass. pnpm 11+ reads this only from pnpm-workspace.yaml
# (it ignores release-age keys in .npmrc).
minimumReleaseAge: 4320

# Only our own first-party packages are exempt: keep this list @rvoh/* only
# (reviewed like any other change).
minimumReleaseAgeExclude:
  - '@rvoh/*'
